<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Registros</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Administrar Registros</h1>

        <a href="/" class="administrar-link">+ Nuevo Registro</a>
        <div class="separator"></div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>DNI</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                {% for registro in registros %}
                <tr>
                    <td>{{ registro[0] }}</td>
                    <td>{{ registro[1] }}</td>
                    <td>{{ registro[2] }}</td>
                    <td>{{ registro[3] }}</td>
                    <td>{{ registro[4] }}</td>
                    <td>{{ registro[5] }}</td>

                    <td class="acciones">
                        <a href="/editar/{{ registro[0] }}" class="btn-editar" title="Editar">✏️</a>

                        <form action="/eliminar/{{ registro[0] }}" method="post" style="display:inline;">
                            <button type="submit" class="btn-eliminar" title="Eliminar"
                                onclick="return confirm('¿Deseas eliminar este registro?')">🗑️</button>
                        </form>
                    </td>
                </tr>

                {% else %}
                <tr>
                    <td colspan="7" class="sin-registros">No hay registros disponibles.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
